name: CBCT Hardware Record
description: Create and maintain the hardware, software, and firmware history for a CBCT machine
title: "[Hardware Record CBCT] (Serial Number) (Model) (Customer/Location)"
labels:
  - hardware-record

body:
  - type: markdown
    attributes:
      value: |
        # CBCT Hardware Record

        This issue is the permanent hardware configuration and service history
        for this CBCT machine.

        Update this issue whenever software, firmware, or hardware is changed.

        **Add new history rows. Do not overwrite previous entries.**

  - type: input
    id: hardware_serial_number
    attributes:
      label: Hardware Serial Number
      placeholder: Enter hardware serial number
    validations:
      required: true

  - type: input
    id: hardware_model
    attributes:
      label: Hardware Model
      placeholder: Enter hardware model
    validations:
      required: true

  - type: input
    id: customer_location
    attributes:
      label: Customer / Location
      placeholder: Enter customer name and/or location
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## DR Panel

  - type: textarea
    id: dr_panel
    attributes:
      label: DR Panel History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Manufacturer | Model | Serial Number | Date Installed | Notes of Installation |
        | --- | --- | --- | --- | --- |
        | [Manufacturer] | [Model] | [Serial Number] | [Date Installed] | [Notes of Installation] |
        |  |  |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### NVIDIA Graphics Card

  - type: textarea
    id: nvidia_graphics_card
    attributes:
      label: NVIDIA Graphics Card History
      description: Add a new row for each driver change. Do not overwrite previous entries.
      value: |
        | Version | Date Installed | Notes of Installation |
        | --- | --- | --- |
        | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Intel Network Adapter

  - type: textarea
    id: intel_network_adapter
    attributes:
      label: Intel Network Adapter History
      description: Add a new row for each driver change. Do not overwrite previous entries.
      value: |
        | Version | Date Installed | Notes of Installation |
        | --- | --- | --- |
        | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Software History

  - type: textarea
    id: software_history
    attributes:
      label: Software History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Version | Date Installed | Notes of Installation |
        | --- | --- | --- |
        | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Monoblock Firmware History

  - type: textarea
    id: monoblock_firmware_history
    attributes:
      label: Monoblock Firmware History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Version | Date Installed | Notes of Installation |
        | --- | --- | --- |
        | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## IMD Inverter

  - type: textarea
    id: imd_inverter
    attributes:
      label: IMD Inverter History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Serial Number | Version | Date Installed | Notes of Installation |
        | --- | --- | --- | --- |
        | [Serial Number] | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## IMD Rotor

  - type: textarea
    id: imd_rotor
    attributes:
      label: IMD Rotor History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Serial Number | Version | Date Installed | Notes of Installation |
        | --- | --- | --- | --- |
        | [Serial Number] | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## IMD Filament

  - type: textarea
    id: imd_filament
    attributes:
      label: IMD Filament History
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Serial Number | Version | Date Installed | Notes of Installation |
        | --- | --- | --- | --- |
        | [Serial Number] | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |  |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Recotom Version

  - type: textarea
    id: recotom_version
    attributes:
      label: Recotom Version
      description: Add a new row for each change. Do not overwrite previous entries.
      value: |
        | Version | Date Installed | Notes of Installation |
        | --- | --- | --- |
        | [Version] | [Date Installed] | [Notes of Installation] |
        |  |  |  |
    validations:
      required: true

  - type: dropdown
    id: motorized_exam_table
    attributes:
      label: Motorized Exam Table
      description: Specify whether this CBCT is equipped with a motorized exam table.
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Issues
      description: Description of issues.
      value: |
        | Issue Description | Date | Solution |
        | --- | --- | --- |
        | [Issue Description] | [Date] | [Solution] |
        |  |  |  |
    validations:
      required: true
